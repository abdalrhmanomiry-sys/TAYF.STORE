<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متجر طيف</title>
<meta name="description" content="متجر طيف — كتب ومنتجات مختارة، واطلب بسهولة عبر واتساب." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f3;--surface:#fff;--elevated:#f4efe4;--line:#e0d8c6;
  --fg:#181614;--muted:#6e685c;--gold:#c9a24b;--gold-soft:#e3c268;--gold-deep:#a4812f;--ink:#0b0b0c;
}
html[data-theme="dark"]{
  --bg:#0b0b0c;--surface:#161618;--elevated:#1e1e22;--line:#302c26;
  --fg:#f5f1e8;--muted:#a8a092;--gold:#c9a24b;--gold-soft:#e3c268;--gold-deep:#a4812f;--ink:#0b0b0c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:'Tajawal',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'El Messiri',serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
::selection{background:var(--gold);color:var(--ink)}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;border-radius:999px;padding:11px 22px;font-family:inherit;font-weight:700;font-size:14px;transition:.2s}
.btn-gold{background:var(--gold);color:var(--ink)} .btn-gold:hover{background:var(--gold-soft)}
.btn-outline{background:transparent;border:1px solid var(--gold);color:var(--gold)} .btn-outline:hover{background:var(--gold);color:var(--ink)}
.btn-ghost{background:var(--elevated);color:var(--fg)}
.btn-wa{background:#25D366;color:#fff} .btn-ig{background:linear-gradient(135deg,#feda75,#d62976,#962fbf);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{font-family:'El Messiri',serif;font-weight:700;font-size:22px;white-space:nowrap;cursor:pointer}
.logo span{color:var(--gold)}
.search{flex:1;position:relative;max-width:520px}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 42px 0 14px;font-family:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--gold)}
.search .ic{position:absolute;right:0;top:0;height:42px;width:42px;display:grid;place-items:center;color:var(--muted)}
.icon-btn{position:relative;height:40px;width:40px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;flex-shrink:0}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.cart-count{position:absolute;top:-4px;left:-4px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center;padding:0 4px}

.layout{display:grid;grid-template-columns:1fr;gap:20px;margin:18px 0}
@media(min-width:900px){.layout{grid-template-columns:240px 1fr}}
.sidebar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;align-self:start}
@media(min-width:900px){.sidebar{position:sticky;top:84px}}
.side-title{font-size:13px;color:var(--muted);padding:8px 12px 4px;font-weight:700}
.side-link{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14.5px;transition:.15s}
.side-link:hover{background:var(--elevated)}
.side-link.active{background:var(--gold);color:var(--ink);font-weight:700}
.side-link .n{font-size:12px;opacity:.7}
.side-link.new-link{color:var(--gold);font-weight:700}
.side-link.new-link.active{color:var(--ink)}

.side-toggle{display:none}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:63px;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--gold)}
.chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}

.banner-area{margin-bottom:18px}
.banner{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);min-height:200px}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.banner .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,12,.8),transparent)}
.banner .txt{position:relative;padding:40px 28px;color:#fff;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end}
.banner .ey{color:var(--gold-soft);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.banner h2{font-size:clamp(22px,4vw,38px);margin:8px 0;color:#fff}
.banner.empty{background:linear-gradient(120deg,#161618,#0b0b0c)}
.banner-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.banner-dots i{width:7px;height:7px;border-radius:999px;background:var(--line);cursor:pointer}
.banner-dots i.active{background:var(--gold);width:22px}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px;flex-wrap:wrap}
.toolbar select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font-family:inherit;font-size:14px;outline:none}
.count{color:var(--muted);font-size:14px}
.section-title{font-size:24px}
.section-title::after{content:"";display:block;width:56px;height:2px;margin-top:8px;background:linear-gradient(to left,var(--gold),transparent)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card .thumb{position:relative;aspect-ratio:4/5;background:var(--elevated);overflow:hidden;cursor:pointer}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .thumb img{transform:scale(1.05)}
.badges{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.new{background:var(--gold);color:var(--ink)} .badge.offer{background:#dc2626;color:#fff}
.soldout{position:absolute;inset:0;background:rgba(11,11,12,.55);display:grid;place-items:center}
.soldout span{border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 14px;border-radius:999px;font-size:12px}
.card .body{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .cat{font-size:11px;color:var(--gold);cursor:pointer}
.card .name{font-weight:700;font-size:14px;line-height:1.35;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card .author{font-size:12px;color:var(--muted)}
.price{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.price b{font-size:15px} .price s{font-size:12px;color:var(--muted)}
.avail{font-size:11px;color:var(--muted)}
.card .add{margin-top:6px}
.card .add button{width:100%;font-size:13px;padding:8px}

.crumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin:16px 0;flex-wrap:wrap}
.crumb a{cursor:pointer} .crumb a:hover{color:var(--gold)}
.pview{display:grid;grid-template-columns:1fr;gap:28px;margin-bottom:30px}
@media(min-width:768px){.pview{grid-template-columns:1fr 1fr}}
.gallery .main{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--elevated)}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;background:rgba(11,11,12,.5);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;font-size:20px}
.gnav.prev{right:10px} .gnav.next{left:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumbs img{height:64px;width:64px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.thumbs img.active{border-color:var(--gold)}
.pinfo{display:flex;flex-direction:column;gap:16px}
.pinfo h1{font-size:28px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:999px}
.tag.in{background:rgba(34,197,94,.12);color:#16a34a} .tag.out{background:rgba(220,38,38,.12);color:#dc2626}
.prices{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prices .pr{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.prices .pr:last-child{border-bottom:none}
.prices .pr .cur{color:var(--muted);font-size:13px}
.prices .pr .val{font-weight:700;font-size:17px;color:var(--gold)}
.prices .pr .val s{color:var(--muted);font-weight:400;font-size:13px;margin-inline-start:8px}
.block h3{font-size:16px;margin-bottom:6px}
.block .body-txt{color:var(--muted);white-space:pre-line;line-height:1.85}
.notes{background:var(--elevated);border-right:3px solid var(--gold);border-radius:10px;padding:12px 14px;color:var(--fg)}
.book{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px}
.book dt{color:var(--muted);font-size:11px} .book dd{font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{width:40px;height:42px;background:none;border:none;color:var(--fg);font-size:18px;cursor:pointer}
.qty span{width:44px;text-align:center;font-weight:700}
.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:15px;outline:none}
.field:focus{border-color:var(--gold)}
.label{font-size:13px;font-weight:500;margin-bottom:5px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}

.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.cart-item img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex-shrink:0}
.cart-item .ci-body{flex:1;min-width:0}
.cart-item .ci-name{font-weight:700;font-size:15px}
.cart-totals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.cart-totals .t-row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.cart-totals .t-row.big{font-weight:700;font-size:17px;color:var(--gold);border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.link-remove{color:#dc2626;background:none;border:none;cursor:pointer;font-size:13px}

footer{margin-top:50px;border-top:1px solid var(--line);background:var(--surface)}
.foot{padding:32px 0;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.foot .fitems{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.foot .fitem{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;color:var(--fg)}
.foot .fitem:hover{border-color:var(--gold)}
.foot .delivery{color:var(--gold);font-weight:700;font-size:15px}
.copy{border-top:1px solid var(--line);text-align:center;padding:14px;color:var(--muted);font-size:12px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* شاشة التحميل */
.loading{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--muted);font-size:15px}
.loading .dot{display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:999px;margin:0 3px;animation:bounce 1.2s infinite}
.loading .dot:nth-child(2){animation-delay:.15s}
.loading .dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-8px);opacity:1}}
</style>
</head>
<body data-theme="dark">

<header>
  <div class="container bar">
    <div class="logo" onclick="navTo('')" id="logo">متجر طيف<span>.</span></div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="ابحث عن منتج..." />
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg></span>
    </div>
    <button class="icon-btn" onclick="go('cart')" aria-label="السلة">
      🛒<span class="cart-count" id="cartCount" style="display:none">0</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع">☀️</button>
  </div>
  <div id="chipBar" class="chipbar"></div>
</header>

<main class="container" id="app">
  <div class="loading"><span>جاري تحميل المتجر</span><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
</main>

<footer>
  <div class="container foot" id="foot"></div>
  <div class="copy" id="copy"></div>
</footer>

<script>
/* ============================================================
   متغيرات عامة (تُحدّث من API)
   ============================================================ */
let SETTINGS = {};
let BANNERS = [];
let CATEGORIES = [];
let PRODUCTS = [];

const HOUR = 3600000;

/* ============================================================
   تحميل البيانات من API
   ============================================================ */
async function loadData(){
  try{
    const res = await fetch("/api/data", { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    SETTINGS = data.settings || {};
    BANNERS = data.banners || [];
    CATEGORIES = data.categories || [];
    PRODUCTS = data.products || [];
    return true;
  }catch(e){
    console.error("loadData error", e);
    document.getElementById("app").innerHTML =
      `<div class="empty">
        <h2 class="section-title" style="justify-content:center">تعذّر تحميل المتجر</h2>
        <p style="margin-top:10px">يرجى تحديث الصفحة بعد قليل.</p>
        <p style="margin-top:10px;color:#dc2626;font-size:13px">${String(e.message||e)}</p>
      </div>`;
    return false;
  }
}

/* ============================================================
   منطق المتجر
   ============================================================ */
const CUR = [["SYP","ل.س"],["USD","$"],["TRY","₺"]];
const fmtN = v => new Intl.NumberFormat("ar-SY",{maximumFractionDigits:0}).format(v||0);
const money = (v,c) => fmtN(v)+" "+(({SYP:"ل.س",USD:"$",TRY:"₺"})[c]||c);
const catName = s => (CATEGORIES.find(c=>c.slug===s)||{}).name || "";
const availText = a => a==="in"?"متوفر":a==="limited"?"كمية محدودة":"غير متوفر";
const isNew = p => (Date.now() - p.created) < 24*HOUR;
const byId = id => PRODUCTS.find(p=>p.id===id);
const state = {q:"", sort:"newest"};

/* السلة */
let cart = {};
try{ cart = JSON.parse(localStorage.getItem("tayf_cart")||"{}"); }catch(e){ cart={}; }
function saveCart(){ localStorage.setItem("tayf_cart", JSON.stringify(cart)); updateCartCount(); }
function cartQty(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function addToCart(id, qty){ qty=qty||1; cart[id]=(cart[id]||0)+qty; saveCart(); }
function setQty(id, qty){ if(qty<=0) delete cart[id]; else cart[id]=qty; saveCart(); }
function cartTotals(){
  const t={SYP:0,USD:0,TRY:0};
  for(const id in cart){ const p=byId(+id); if(!p) continue;
    for(const [c] of CUR) t[c]+=(p.prices[c]||0)*cart[id]; }
  return t;
}
function updateCartCount(){
  const n=cartQty(); const el=document.getElementById("cartCount");
  if(!el) return;
  el.textContent=n; el.style.display=n?"grid":"none";
}

function toggleSidebar(open){
  const sb=document.getElementById("sidebar");
  if(!sb) return;
  sb.classList.toggle("open",open);
}

function go(path){ location.hash = path?("#"+path):"#"; }
function navTo(path){
  state.q="";
  const s=document.getElementById("searchInput"); if(s) s.value="";
  toggleSidebar(false);
  if(("#"+path)===location.hash || (path===""&&(location.hash===""||location.hash==="#"))){ route(); }
  else go(path);
}
window.addEventListener("hashchange", route);

function renderChips(active){
  const bar=document.getElementById("chipBar"); if(!bar) return;
  let h=`<button class="chip ${active===''?'active':''}" onclick="navTo('')">🏠 الرئيسية</button>`;
  h+=`<button class="chip ${active==='new'?'active':''}" onclick="navTo('new')">🆕 جديد</button>`;
  CATEGORIES.forEach(c=>{ h+=`<button class="chip ${active===c.slug?'active':''}" onclick="navTo('category/${c.slug}')">${c.name}</button>`; });
  bar.innerHTML=h;
}

function sidebarHTML(active){
  const counts = {}; PRODUCTS.forEach(p=>counts[p.category]=(counts[p.category]||0)+1);
  const newCount = PRODUCTS.filter(isNew).length;
  let h = `<div class="sidebar" id="sidebar"><div class="side-title">الأقسام</div>`;
  h += `<div class="side-link new-link ${active==='new'?'active':''}" onclick="navTo('new')">
        <span>🆕 جديد</span><span class="n">${newCount}</span></div>`;
  h += `<div class="side-link ${active===''?'active':''}" onclick="navTo('')">
        <span>كل المنتجات</span><span class="n">${PRODUCTS.length}</span></div>`;
  CATEGORIES.forEach(c=>{
    h += `<div class="side-link ${active===c.slug?'active':''}" onclick="navTo('category/${c.slug}')">
          <span>${c.name}</span><span class="n">${counts[c.slug]||0}</span></div>`;
  });
  h += `</div>`;
  return h;
}

let bannerIdx=0, bannerTimer=null;
function bannerHTML(){
  if(!BANNERS.length){
    return `<div class="banner-area"><div class="banner empty"><div class="txt">
      <div class="ey">${SETTINGS.storeName||""}</div>
      <h2>${SETTINGS.description||"أهلاً بك"}</h2></div></div></div>`;
  }
  const dots = BANNERS.length>1 ? `<div class="banner-dots">${BANNERS.map((_,i)=>`<i class="${i===0?'active':''}" onclick="showBanner(${i})"></i>`).join("")}</div>`:"";
  return `<div class="banner-area">
    <div class="banner" id="bannerBox" onclick="bannerClick()"></div>${dots}</div>`;
}
function renderBanner(){
  const box=document.getElementById("bannerBox"); if(!box) return;
  const b=BANNERS[bannerIdx]; if(!b) return;
  box.innerHTML = `<img src="${b.image||""}" alt=""><div class="ov"></div>
    <div class="txt">${b.eyebrow?`<div class="ey">${b.eyebrow}</div>`:''}
    ${b.title?`<h2>${b.title}</h2>`:''}</div>`;
  document.querySelectorAll(".banner-dots i").forEach((d,i)=>d.classList.toggle("active",i===bannerIdx));
}
function showBanner(i){ bannerIdx=i; renderBanner(); }
function bannerClick(){ const b=BANNERS[bannerIdx]; if(b&&b.link) location.hash=b.link.replace(/^#/,"#"); }
function startBanner(){
  clearInterval(bannerTimer);
  if(BANNERS.length>1){ bannerTimer=setInterval(()=>{ bannerIdx=(bannerIdx+1)%BANNERS.length; renderBanner(); },5000); }
}

function getList(mode, slug){
  let list=PRODUCTS.slice();
  if(mode==="category") list=list.filter(p=>p.category===slug);
  if(mode==="new") list=list.filter(isNew);
  if(state.q){ const q=state.q.trim();
    list=list.filter(p=>p.name.includes(q)||(p.description||"").includes(q)||(p.author||"").includes(q)); }
  if(state.sort==="price_asc") list.sort((a,b)=>a.prices.SYP-b.prices.SYP);
  else if(state.sort==="price_desc") list.sort((a,b)=>b.prices.SYP-a.prices.SYP);
  else if(state.sort==="views") list.sort((a,b)=>(b.views||0)-(a.views||0));
  else list.sort((a,b)=>b.created-a.created);
  return list;
}
function cardHTML(p){
  const offer=p.oldPrices&&p.oldPrices.SYP>p.prices.SYP;
  const img = (p.images&&p.images[0])||"";
  return `<article class="card">
    <div class="thumb" onclick="go('product/${p.id}')">
      <img loading="lazy" src="${img}" alt="${p.name}">
      <div class="badges">${isNew(p)?'<span class="badge new">جديد</span>':''}${offer?'<span class="badge offer">عرض</span>':''}</div>
      ${p.availability==="out"?'<div class="soldout"><span>غير متوفر</span></div>':''}
    </div>
    <div class="body">
      <div class="cat" onclick="navTo('category/${p.category}')">${catName(p.category)}</div>
      <div class="name" onclick="go('product/${p.id}')">${p.name}</div>
      ${p.author?`<div class="author">${p.author}</div>`:''}
      <div class="price"><b>${money(p.prices.SYP,"SYP")}</b>${offer?`<s>${money(p.oldPrices.SYP,"SYP")}</s>`:''}</div>
      <div class="add">${p.availability==="out"
        ?'<button class="btn btn-ghost" disabled>غير متوفر</button>'
        :`<button class="btn btn-outline" onclick="addToCart(${p.id},1);toast('أُضيف إلى السلة')">+ أضف للسلة</button>`}</div>
    </div></article>`;
}
function renderListing(mode, slug){
  const list=getList(mode,slug);
  const active = mode==="category"?slug : mode==="new"?"new" : "";
  const title = state.q?`نتائج: ${state.q}` : mode==="new"?"وصل حديثاً":mode==="category"?catName(slug):"كل المنتجات";
  const banner = (mode==="" && !state.q)?bannerHTML():"";
  document.getElementById("app").innerHTML = `
    ${banner}
    <div class="toolbar">
      <h2 class="section-title">${title}</h2>
      <select id="sortSel">
        <option value="newest">الأحدث</option>
        <option value="price_asc">السعر: من الأقل</option>
        <option value="price_desc">السعر: من الأعلى</option>
        <option value="views">الأكثر مشاهدة</option>
      </select>
    </div>
    <div class="count">${list.length} نتيجة</div>
    ${list.length?`<div class="grid">${list.map(cardHTML).join("")}</div>`
      :`<div class="empty">لا توجد منتجات هنا حالياً.</div>`}`;
  const sel=document.getElementById("sortSel");
  if(sel){ sel.value=state.sort; sel.onchange=e=>{state.sort=e.target.value; route();}; }
  const si=document.getElementById("searchInput");
  if(si && document.activeElement!==si) si.value=state.q;
  if(banner){ bannerIdx=0; renderBanner(); startBanner(); }
}

let gImg=0;
function renderProduct(id){
  const p=byId(id);
  if(!p){ document.getElementById("app").innerHTML='<div class="empty">المنتج غير موجود.</div>'; return; }
  gImg=0;
  const offer=p.oldPrices&&p.oldPrices.SYP>p.prices.SYP;
  const isBook=p.author||p.publisher||p.pages||p.year;
  const imgs = p.images && p.images.length ? p.images : [""];
  const pricesRows = CUR.map(([c,sym])=>`
    <div class="pr"><span class="cur">${({SYP:'الليرة السورية',USD:'الدولار الأمريكي',TRY:'الليرة التركية'})[c]}</span>
    <span class="val">${money(p.prices[c],c)}${offer&&p.oldPrices[c]?`<s>${money(p.oldPrices[c],c)}</s>`:''}</span></div>`).join("");
  document.getElementById("app").innerHTML = `
    <div class="crumb"><a onclick="go('')">الرئيسية</a><span>/</span>
      <a onclick="navTo('category/${p.category}')">${catName(p.category)}</a><span>/</span>
      <span style="color:var(--fg)">${p.name}</span></div>
    <div class="pview">
      <div class="gallery">
        <div class="main">
          <img id="gMain" src="${imgs[0]}" alt="${p.name}">
          ${imgs.length>1?`<button class="gnav prev" onclick="gStep(-1)">›</button><button class="gnav next" onclick="gStep(1)">‹</button>`:''}
        </div>
        ${imgs.length>1?`<div class="thumbs">${imgs.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" onclick="gSet(${i})">`).join("")}</div>`:''}
      </div>
      <div class="pinfo">
        <div class="cat" style="color:var(--gold)">${catName(p.category)} ${isNew(p)?'· جديد':''}</div>
        <h1>${p.name}</h1>
        <div><span class="tag ${p.availability==='out'?'out':'in'}">${availText(p.availability)}</span></div>
        <div class="prices">${pricesRows}</div>
        ${isBook?`<dl class="book">
          ${p.author?`<div><dt>المؤلف</dt><dd>${p.author}</dd></div>`:''}
          ${p.publisher?`<div><dt>دار النشر</dt><dd>${p.publisher}</dd></div>`:''}
          ${p.pages?`<div><dt>الصفحات</dt><dd>${p.pages}</dd></div>`:''}
          ${p.year?`<div><dt>سنة النشر</dt><dd>${p.year}</dd></div>`:''}
          ${p.language?`<div><dt>اللغة</dt><dd>${p.language}</dd></div>`:''}
          ${p.isbn?`<div><dt>ISBN</dt><dd>${p.isbn}</dd></div>`:''}
        </dl>`:''}
        <div class="block"><h3>الوصف</h3><div class="body-txt">${p.description||"—"}</div></div>
        ${p.notes?`<div class="block"><h3>ملاحظات</h3><div class="notes">${p.notes}</div></div>`:''}
        ${p.availability!=="out"?`
        <div class="row" style="align-items:flex-end">
          <div style="flex:0 0 auto"><label class="label">الكمية</label>
            <div class="qty"><button onclick="pStep(-1)">−</button><span id="pQty">1</span><button onclick="pStep(1)">+</button></div>
          </div>
          <button class="btn btn-gold" style="flex:1" onclick="addFromPage(${p.id})">أضف إلى السلة 🛒</button>
        </div>`:'<button class="btn btn-ghost" disabled>غير متوفر حالياً</button>'}
        <div class="row">
          ${SETTINGS.whatsapp?`<a class="btn btn-wa" target="_blank" href="https://wa.me/${SETTINGS.whatsapp}?text=${encodeURIComponent('مرحباً '+SETTINGS.storeName+'، مهتم بمنتج: '+p.name)}">واتساب</a>`:''}
          ${SETTINGS.instagram?`<a class="btn btn-ig" target="_blank" href="https://instagram.com/${SETTINGS.instagram}">إنستغرام</a>`:''}
        </div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
let pQ=1;
function pStep(d){ pQ=Math.max(1,Math.min(999,pQ+d)); document.getElementById("pQty").textContent=pQ; }
function gSet(i){
  const p=byId(curProductId()); if(!p) return;
  gImg=i; document.getElementById("gMain").src=p.images[i];
  document.querySelectorAll(".thumbs img").forEach((t,idx)=>t.classList.toggle("active",idx===i));
}
function gStep(d){ const p=byId(curProductId()); if(!p) return; gImg=(gImg+d+p.images.length)%p.images.length; gSet(gImg); }
function addFromPage(id){ addToCart(id,pQ); pQ=1; toast('أُضيف إلى السلة'); }
function curProductId(){ const m=location.hash.match(/product\/(\d+)/); return m?+m[1]:null; }

function renderCart(){
  const ids=Object.keys(cart).filter(id=>byId(+id));
  // إزالة العناصر التي لم تعد موجودة
  Object.keys(cart).forEach(id=>{ if(!byId(+id)) delete cart[id]; });
  saveCart();
  if(!ids.length){
    document.getElementById("app").innerHTML=`<div class="empty">
      <h2 class="section-title" style="justify-content:center">سلة المشتريات فارغة</h2>
      <p style="margin-top:10px">أضف بعض المنتجات لتبدأ.</p>
      <button class="btn btn-gold" style="margin-top:16px" onclick="go('')">تصفّح المنتجات</button></div>`;
    return;
  }
  const t=cartTotals();
  const rows=ids.map(id=>{ const p=byId(+id); const q=cart[id];
    return `<div class="cart-item">
      <img src="${p.images[0]}" alt="${p.name}" onclick="go('product/${p.id}')" style="cursor:pointer">
      <div class="ci-body">
        <div class="ci-name">${p.name}</div>
        <div class="avail" style="margin:3px 0">${money(p.prices.SYP,"SYP")} · للقطعة</div>
        <div class="qty"><button onclick="cartStep(${p.id},-1)">−</button><span>${q}</span><button onclick="cartStep(${p.id},1)">+</button></div>
      </div>
      <div style="text-align:end">
        <div style="font-weight:700">${money(p.prices.SYP*q,"SYP")}</div>
        <button class="link-remove" onclick="cartRemove(${p.id})">حذف</button>
      </div></div>`;
  }).join("");
  document.getElementById("app").innerHTML=`
    <div class="crumb"><a onclick="go('')">الرئيسية</a><span>/</span><span style="color:var(--fg)">السلة</span></div>
    <h2 class="section-title" style="margin-bottom:10px">سلة المشتريات</h2>
    <div class="layout" style="grid-template-columns:1fr">
      <div>
        ${rows}
        <div class="cart-totals">
          <div class="t-row"><span>الإجمالي (ل.س)</span><span>${money(t.SYP,"SYP")}</span></div>
          <div class="t-row"><span>الإجمالي ($)</span><span>${money(t.USD,"USD")}</span></div>
          <div class="t-row big"><span>الإجمالي (₺)</span><span>${money(t.TRY,"TRY")}</span></div>
        </div>
        <div class="cart-totals">
          <div class="row">
            <div><label class="label">الاسم</label><input class="field" id="cName" placeholder="اسمك"></div>
            <div><label class="label">رقم الهاتف</label><input class="field" id="cPhone" dir="ltr" placeholder="09xxxxxxxx"></div>
          </div>
          <div style="margin-top:10px"><label class="label">ملاحظات</label><textarea class="field" id="cNotes" rows="2" placeholder="اختياري"></textarea></div>
          <div id="cErr" style="color:#dc2626;font-size:13px;margin-top:8px"></div>
          <button class="btn btn-wa" style="width:100%;margin-top:12px" onclick="checkout()">إتمام الطلب عبر واتساب</button>
          <p style="text-align:center;color:var(--gold);font-weight:700;margin-top:10px">${SETTINGS.deliveryNote||""}</p>
        </div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}
function cartStep(id,d){ const q=(cart[id]||0)+d; setQty(id,q); renderCart(); }
function cartRemove(id){ delete cart[id]; saveCart(); renderCart(); }
function checkout(){
  const name=(document.getElementById("cName").value||"").trim();
  const phone=(document.getElementById("cPhone").value||"").trim();
  const notes=(document.getElementById("cNotes").value||"").trim();
  const err=document.getElementById("cErr");
  if(name.length<2){err.textContent="الرجاء إدخال الاسم";return;}
  if(phone.length<6){err.textContent="الرجاء إدخال رقم هاتف صحيح";return;}
  if(!SETTINGS.whatsapp){ err.textContent="لم يتم ضبط رقم واتساب المتجر"; return; }
  const t=cartTotals();
  const lines=["🛒 طلب جديد من "+SETTINGS.storeName,""];
  for(const id in cart){ const p=byId(+id); if(!p) continue;
    lines.push(`• ${p.name} ×${cart[id]} — ${money(p.prices.SYP*cart[id],"SYP")}`); }
  lines.push("", "الإجمالي:", money(t.SYP,"SYP")+" / "+money(t.USD,"USD")+" / "+money(t.TRY,"TRY"),
    "", "الاسم: "+name, "الهاتف: "+phone);
  if(notes) lines.push("ملاحظات: "+notes);
  if(SETTINGS.deliveryNote) lines.push("", SETTINGS.deliveryNote);
  window.open("https://wa.me/"+SETTINGS.whatsapp+"?text="+encodeURIComponent(lines.join("\n")),"_blank");
}

let toastTimer=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast";
    el.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:700;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .3s";
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity="1";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.opacity="0",1600);
}

function renderFooter(){
  const items=[];
  if(SETTINGS.email) items.push(`<a class="fitem" href="mailto:${SETTINGS.email}">✉️ ${SETTINGS.email}</a>`);
  if(SETTINGS.whatsapp) items.push(`<a class="fitem" target="_blank" href="https://wa.me/${SETTINGS.whatsapp}"><span dir="ltr">✆ +${SETTINGS.whatsapp}</span></a>`);
  if(SETTINGS.instagram) items.push(`<a class="fitem" target="_blank" href="https://instagram.com/${SETTINGS.instagram}">◎ @${SETTINGS.instagram}</a>`);
  document.getElementById("foot").innerHTML=`
    <div class="fitems">${items.join("")}</div>
    <div class="delivery">${SETTINGS.deliveryNote||""}</div>`;
  document.getElementById("copy").textContent="© "+new Date().getFullYear()+" "+(SETTINGS.storeName||"")+" — جميع الحقوق محفوظة";
  document.getElementById("logo").innerHTML=(SETTINGS.storeName||"المتجر")+'<span>.</span>';
  document.title=SETTINGS.storeName||"المتجر";
}

function route(){
  toggleSidebar(false);
  const h=location.hash.replace(/^#/,"");
  let active="";
  if(h.startsWith("category/")) active=h.split("/")[1];
  else if(h==="new") active="new";
  renderChips(active);
  if(h.startsWith("product/")) return renderProduct(+h.split("/")[1]);
  if(h.startsWith("category/")) return renderListing("category", h.split("/")[1]);
  if(h==="new") return renderListing("new");
  if(h==="cart") return renderCart();
  return renderListing("");
}

function initTheme(){
  const saved=localStorage.getItem("theme")||"dark";
  document.documentElement.setAttribute("data-theme",saved);
  document.getElementById("themeBtn").textContent=saved==="dark"?"☀️":"🌙";
}
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("theme",next);
  document.getElementById("themeBtn").textContent=next==="dark"?"☀️":"🌙";
};

let _t;
document.getElementById("searchInput").addEventListener("input",e=>{
  clearTimeout(_t); _t=setTimeout(()=>{ state.q=e.target.value;
    if(!location.hash || location.hash==="#"){ route(); } else { go(""); }
  },250);
});

/* تشغيل */
(async function init(){
  initTheme();
  const ok = await loadData();
  if(!ok) return;
  renderFooter();
  updateCartCount();
  route();
})();
</script>
</body>
</html>
